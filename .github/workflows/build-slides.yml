name: Compile the slide

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

env:
  # latexmk is driven the same way here as locally, so a green build means a
  # green build on a developer machine too.
  LATEXMK_ARGS: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode -shell-escape -e '$max_repeat=2' -f"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install poppler utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Set up TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          package-file: .github/tl_packages

      # The basic slides \includegraphics this file, so it has to exist first.
      - name: Compile the matrix duck
        working-directory: slides-basics/matrixduck
        run: latexmk ${{ env.LATEXMK_ARGS }} mduck.tex

      - name: Compile the basic slides
        working-directory: slides-basics
        run: latexmk ${{ env.LATEXMK_ARGS }} noanim_ltx_folien.tex

      - name: Compile the basic slides (anim)
        working-directory: slides-basics
        run: latexmk ${{ env.LATEXMK_ARGS }} ltx_folien.tex

      - name: Compile the advanced slides
        working-directory: slides-advanced
        run: latexmk ${{ env.LATEXMK_ARGS }} noanim_ltx_cmd_folien.tex

      - name: Compile the advanced slides (anim)
        working-directory: slides-advanced
        run: latexmk ${{ env.LATEXMK_ARGS }} ltx_cmd_folien.tex

      - name: Generate previews
        run: |
          cp ./slides-basics/noanim_ltx_folien.pdf ./latex_folien.pdf
          cp ./slides-advanced/noanim_ltx_cmd_folien.pdf ./latex_2_folien.pdf
          cp ./slides-basics/ltx_folien.pdf ./anim_latex_folien.pdf
          cp ./slides-advanced/ltx_cmd_folien.pdf ./anim_latex_2_folien.pdf
          pdftoppm -png -f 1 -l 1 ./latex_folien.pdf preview
          pdftoppm -png -f 1 -l 1 ./latex_2_folien.pdf preview_2

      - name: Upload slides as artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: |
            latex_folien.pdf
            latex_2_folien.pdf
            anim_latex_folien.pdf
            anim_latex_2_folien.pdf
            preview-01.png
            preview_2-01.png

      # gh-pages holds nothing but the rendered output, so it is rebuilt as a
      # single orphan commit instead of carrying the source history along.
      - name: Publish to gh-pages
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git checkout --orphan gh-pages-build
          git rm -rq --cached .
          git add -f \
            latex_folien.pdf latex_2_folien.pdf \
            anim_latex_folien.pdf anim_latex_2_folien.pdf \
            preview-01.png preview_2-01.png
          git commit -m "Update PDFs by Workflow"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
